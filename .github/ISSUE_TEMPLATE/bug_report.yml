name: Bug report
description: Report unexpected behavior with a reproducible example.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Agent Progress. Please search existing issues first.
        For suspected vulnerabilities, use the private security report link instead.
        Do not attach credentials, transcripts, raw hook payloads or state databases.
  - type: textarea
    id: behavior
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A small example using synthetic data is ideal.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS/desktop, Python and Codex versions, and the Agent Progress revision if known.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Optional sanitized screenshots or error messages. Include the last-event age for a status mismatch.
