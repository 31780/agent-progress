name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCANNER_VERSION: '8.30.1'
      SCANNER_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan repository history and tracked files for secrets
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d "${RUNNER_TEMP}/agent-progress-gitleaks.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' \
            "https://github.com/gitleaks/gitleaks/releases/download/v${SCANNER_VERSION}/gitleaks_${SCANNER_VERSION}_linux_x64.tar.gz" \
            --output "$scanner_dir/gitleaks.tar.gz"
          printf '%s  %s\n' "$SCANNER_SHA256" "$scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          # Keep the built-in rules; repository files and comments cannot suppress findings.
          printf '[extend]\nuseDefault = true\n' > "$scanner_dir/config.toml"
          scan_options=(--config "$scanner_dir/config.toml" --gitleaks-ignore-path /dev/null
            --ignore-gitleaks-allow --redact=100 --no-banner --no-color --max-archive-depth=3)
          "$scanner_dir/gitleaks" git . --log-opts='--all --full-history' "${scan_options[@]}"
          mkdir "$scanner_dir/tracked"
          git archive HEAD | tar -x -C "$scanner_dir/tracked"
          "$scanner_dir/gitleaks" dir "$scanner_dir/tracked" "${scan_options[@]}"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v

  reports-portable:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Report adapter tests (no desktop or Codex runtime)
        run: python -m unittest discover -s tests -p test_reports.py -v
      - name: Private MCP bridge tests
        run: python -m unittest discover -s tests -p test_mcp.py -v
